[project]
name = "rnn-translation"
version = "0.1.0"
description = "Sequence-to-Sequence RNN model for English to Spanish machine translation using PyTorch Lightning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pytorch-lightning",
    "sacrebleu>=2.6.0",
    "sentencepiece",
    "torch",
    "torchmetrics",
    "tqdm",
    "wandb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data", "model", "training"]

[dependency-groups]
dev = [
    "ruff",
]


